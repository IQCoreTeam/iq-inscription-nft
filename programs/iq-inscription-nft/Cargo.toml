[package]
name = "iq-inscription-nft"
version = "0.1.0"
description = "Registry program for IQ inscription NFTs: one Metaplex Core asset per verified inscription, collections with a PDA authority."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "iq_inscription_nft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
# Exact pin: 0.12.x targets the solana v3 crates and does not compile against
# anchor 0.32; 0.10.x fails on borsh.
mpl-core = "=0.11.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
